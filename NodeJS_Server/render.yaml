databases:
  - name: iot-database
    databaseName: iot_db
    user: iot_user
    plan: free

services:
  - type: web
    name: iot-mqtt-server
    env: node
    buildCommand: npm install
    startCommand: node server_postgres.js
    envVars:
      - key: PORT
        value: 3000
      - key: WS_PORT
        value: 3001
      - key: MQTT_BROKER
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: iot-database
          property: connectionString
      - key: NODE_ENV
        value: production
