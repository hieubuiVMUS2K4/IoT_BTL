# Render.yaml configuration for IoT Dashboard with PostgreSQL
# Note: Database already exists as "iot-database" on Render dashboard
# This file only configures the web service

services:
  - type: web
    name: iot-mqtt-server
    env: node
    buildCommand: npm install
    startCommand: node server_postgres.js
    envVars:
      - key: PORT
        value: 3000
      - key: WS_PORT
        value: 3001
      - key: MQTT_BROKER
        sync: false
      - key: NODE_ENV
        value: production
      # DATABASE_URL phải được set thủ công trong Render Dashboard
      # Vào Web Service → Environment → Add Environment Variable
      # Key: DATABASE_URL
      # Value: Internal Database URL từ PostgreSQL service
